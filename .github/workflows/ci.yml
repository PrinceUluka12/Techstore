name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TechStore.API/TechStore.API.csproj

      - name: Build
        run: dotnet build TechStore.API/TechStore.API.csproj --no-restore --configuration Release

      - name: Publish
        run: dotnet publish TechStore.API/TechStore.API.csproj --no-build --configuration Release --output ./api-publish

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    # The tests run the API against a real SQL Server (a throwaway one in a container)
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: CI-only-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CI-only-Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test TechStore.API.Tests/TechStore.API.Tests.csproj --configuration Release
        env:
          TEST_SQL: 'Server=localhost,1433;User Id=sa;Password=CI-only-Passw0rd;TrustServerCertificate=True'

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: techstore-frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: techstore-frontend

      - name: Build
        run: npm run build
        working-directory: techstore-frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
