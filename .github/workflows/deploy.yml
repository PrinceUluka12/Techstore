name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TechStore.API/TechStore.API.csproj

      - name: Publish
        run: dotnet publish TechStore.API/TechStore.API.csproj --configuration Release --output ./api-publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Keeps the App Service's .NET version in step with the API's (TargetFramework in the .csproj),
      # and Web Sockets on for the back office's live alerts (without them SignalR falls back to
      # slower ways of keeping in touch)
      - name: Set App Service to .NET 10 with Web Sockets
        run: |
          id=$(az resource list --name "${{ secrets.AZURE_WEBAPP_NAME }}" --resource-type Microsoft.Web/sites --query "[0].id" -o tsv)
          az webapp config set --ids "$id" --net-framework-version v10.0 --web-sockets-enabled true --output none

      - name: Deploy to production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./api-publish

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: techstore-frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: techstore-frontend

      - name: Build
        run: npm run build
        working-directory: techstore-frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: techstore-frontend/dist
          skip_app_build: true
